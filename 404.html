<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 — deb-downloader</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center; text-align:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(1200px 600px at 70% -10%, #1a2330 0%, #0d1117 55%); color:#e6edf3; }
  .box { padding:40px; }
  h1 { font-size:5rem; margin:0; background:linear-gradient(135deg,#d70a53,#e95420);
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  p { color:#9aa7b4; font-size:1.1rem; }
  a { display:inline-block; margin-top:18px; padding:12px 22px; border-radius:10px; text-decoration:none;
    color:#fff; font-weight:600; background:linear-gradient(135deg,#d70a53,#e95420); }
</style>
</head>
<body>
  <div class="box">
    <h1>404</h1>
    <p id="msg">Cette page n'existe pas. · This page does not exist.</p>
    <a id="home" href="/">← Retour à l'accueil / Back home</a>
  </div>
  <script>
    if ((navigator.language||"fr").toLowerCase().startsWith("en")){
      document.documentElement.lang="en";
      document.getElementById("msg").textContent="This page does not exist.";
      document.getElementById("home").textContent="← Back home";
    } else {
      document.getElementById("msg").textContent="Cette page n'existe pas.";
      document.getElementById("home").textContent="← Retour à l'accueil";
    }
  </script>
</body>
</html>
