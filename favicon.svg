<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="deb-downloader">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d70a53"/>
      <stop offset="1" stop-color="#e95420"/>
    </linearGradient>
  </defs>
  <!-- rounded app-icon background -->
