<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>deb-downloader — fetch packages</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<style>
  :root{
    --bg:#0d1117; --bg-soft:#161b22; --bg-card:#1b222c; --border:#2a3340;
    --text:#e6edf3; --text-dim:#9aa7b4; --accent:#d70a53; --accent-2:#e95420;
    --ok:#2ea043; --warn:#d29922; --info:#388bfd; --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(1100px 500px at 70% -10%,#1a2330 0%,var(--bg) 55%);
    color:var(--text);min-height:100vh;line-height:1.6;padding:40px 18px}
  .wrap{max-width:640px;margin:0 auto}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.4rem;margin-bottom:6px}
  .brand .dot{width:13px;height:13px;border-radius:50%;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 0 12px var(--accent)}
  .sub{color:var(--text-dim);margin-bottom:26px}
  .card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:24px}
  label{display:block;font-weight:600;margin:16px 0 6px}
  label:first-child{margin-top:0}
  select,input[type=text]{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--border);
    background:var(--bg-soft);color:var(--text);font-size:1rem}
  .row{display:flex;gap:14px}
  .row>div{flex:1}
  .check{display:flex;align-items:center;gap:9px;margin-top:16px;color:var(--text-dim);font-weight:400}
  .check input{width:auto}
  .hint{color:var(--text-dim);font-size:.85rem;margin-top:5px}
  button{margin-top:22px;width:100%;padding:13px;border:none;border-radius:10px;cursor:pointer;
    font-size:1.05rem;font-weight:700;color:#fff;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    box-shadow:0 6px 20px rgba(215,10,83,.35);transition:transform .12s,opacity .2s}
  button:hover:not(:disabled){transform:translateY(-2px)}
  button:disabled{opacity:.55;cursor:not-allowed}
  .status{margin-top:18px;padding:14px 16px;border-radius:10px;display:none;font-size:.95rem}
  .status.show{display:block}
  .status.work{background:rgba(56,139,253,.12);border:1px solid var(--info);color:#cfe3ff}
  .status.ok{background:rgba(46,160,67,.12);border:1px solid var(--ok);color:#caf0d4}
  .status.err{background:rgba(215,10,83,.12);border:1px solid var(--accent);color:#ffd0df}
  .spin{display:inline-block;width:15px;height:15px;border:2px solid currentColor;border-right-color:transparent;
    border-radius:50%;animation:spin 1s linear infinite;vertical-align:-2px;margin-right:8px}
  @keyframes spin{to{transform:rotate(360deg)}}
  footer{color:var(--text-dim);font-size:.8rem;margin-top:24px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><span class="dot"></span> deb-downloader</div>
  <p class="sub">Pick a distribution, type one or more packages, and download a <b>.zip</b>
     containing the packages plus all their dependencies (offline-ready).</p>

  <div class="card">
    <div class="row">
      <div>
        <label for="distro">Distribution</label>
        <select id="distro"></select>
      </div>
      <div>
        <label for="release">Version</label>
        <select id="release"></select>
      </div>
    </div>

    <label for="packages">Package(s)</label>
    <input type="text" id="packages" placeholder="e.g. nginx  (space or comma separated)" />
    <div class="hint">Lowercase names only — letters, digits and <code>+ . _ -</code>.</div>

    <label class="check"><input type="checkbox" id="norec" /> Exclude recommended packages (<code>--no-install-recommends</code>)</label>

    <button id="go">⬇️ Fetch &amp; download .zip</button>
    <div id="status" class="status"></div>
  </div>

  <footer>© 2026 Remilulz91 — deb-downloader. All rights reserved.</footer>
</div>

<script>
var distroSel = document.getElementById("distro");
var releaseSel = document.getElementById("release");
var pkgInput = document.getElementById("packages");
var norec = document.getElementById("norec");
var goBtn = document.getElementById("go");
var statusEl = document.getElementById("status");

var MAP = {};   // distro -> [releases]

function setStatus(kind, html){
  statusEl.className = "status show " + kind;
  statusEl.innerHTML = html;
}
function clearStatus(){ statusEl.className = "status"; statusEl.innerHTML = ""; }

function fillReleases(){
  var d = distroSel.value;
  releaseSel.innerHTML = "";
  (MAP[d] || []).forEach(function(r){
    var o = document.createElement("option"); o.value = r; o.textContent = r;
    releaseSel.appendChild(o);
  });
}

// Load supported distributions from the API.
// Relative paths so the page works both standalone (:8000) and behind the
// reverse proxy (served under /app/).
fetch("api/distributions")
  .then(function(r){ return r.json(); })
  .then(function(data){
    (data.distributions || []).forEach(function(item){
      if(!MAP[item.distro]) MAP[item.distro] = [];
      MAP[item.distro].push(item.release);
    });
    Object.keys(MAP).forEach(function(d){
      var o = document.createElement("option");
      o.value = d; o.textContent = d.charAt(0).toUpperCase() + d.slice(1);
      distroSel.appendChild(o);
    });
    fillReleases();
  })
  .catch(function(){ setStatus("err", "Could not reach the API."); });

distroSel.addEventListener("change", fillReleases);

goBtn.addEventListener("click", function(){
  var packages = pkgInput.value.split(/[\s,]+/).filter(Boolean);
  if(packages.length === 0){ setStatus("err", "Please enter at least one package."); return; }

  var body = {
    distro: distroSel.value,
    release: releaseSel.value,
    arch: "amd64",
    packages: packages,
    no_recommends: norec.checked
  };

  goBtn.disabled = true;
  setStatus("work", '<span class="spin"></span>Fetching ' + packages.join(", ") +
    ' for ' + distroSel.value + ' ' + releaseSel.value + '… This can take a while.');

  fetch("api/fetch", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body)
  })
  .then(function(res){
    if(!res.ok){
      return res.json().then(function(j){ throw new Error(j.detail || ("HTTP " + res.status)); });
    }
    var name = "packages.zip";
    var cd = res.headers.get("Content-Disposition") || "";
    var m = cd.match(/filename="?([^"]+)"?/);
    if(m) name = m[1];
    return res.blob().then(function(blob){ return {blob: blob, name: name}; });
  })
  .then(function(out){
    var url = URL.createObjectURL(out.blob);
    var a = document.createElement("a");
    a.href = url; a.download = out.name; document.body.appendChild(a); a.click();
    a.remove(); URL.revokeObjectURL(url);
    setStatus("ok", "✅ Done — your download (<b>" + out.name + "</b>) has started.");
  })
  .catch(function(err){
    setStatus("err", "❌ " + err.message);
  })
  .finally(function(){ goBtn.disabled = false; });
});
</script>
</body>
</html>
