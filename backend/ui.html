<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>deb-downloader</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<style>
  :root{
    --bg:#0d1117; --bg-soft:#161b22; --bg-card:#1b222c; --border:#2a3340;
    --text:#e6edf3; --text-dim:#9aa7b4; --accent:#d70a53; --accent-2:#e95420;
    --ok:#2ea043; --warn:#d29922; --info:#388bfd; --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(1100px 500px at 70% -10%,#1a2330 0%,var(--bg) 55%);
    color:var(--text);min-height:100vh;line-height:1.6;padding:34px 18px}
  .wrap{max-width:640px;margin:0 auto}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.4rem}
  .brand .dot{width:13px;height:13px;border-radius:50%;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 0 12px var(--accent)}
  .lang{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
  .lang button{background:transparent;color:var(--text-dim);border:none;cursor:pointer;
    padding:6px 11px;font-size:.85rem;font-weight:700;transition:background .15s,color .15s}
  .lang button.active{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff}
  .sub{color:var(--text-dim);margin-bottom:26px}
  .card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:24px}
  label{display:block;font-weight:600;margin:16px 0 6px}
  label.lbl-first{margin-top:0}
  select,input[type=text]{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--border);
    background:var(--bg-soft);color:var(--text);font-size:1rem}
  .row{display:flex;gap:14px;flex-wrap:wrap}
  .row>div{flex:1;min-width:140px}
  .check{display:flex;align-items:center;gap:9px;margin-top:16px;color:var(--text-dim);font-weight:400}
  .check input{width:auto}
  .hint{color:var(--text-dim);font-size:.85rem;margin-top:5px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:5px 6px 5px 11px;border-radius:999px;
        background:var(--bg-soft);border:1px solid var(--border);font-size:.9rem}
  .chip-name{font-weight:600}
  .chip-ver{width:128px;padding:3px 7px;border-radius:7px;border:1px solid var(--border);
            background:var(--bg);color:var(--text);font-size:.8rem}
  .chip-x{cursor:pointer;border:none;background:transparent;color:var(--text-dim);font-size:1.15rem;
          line-height:1;padding:0 5px;border-radius:6px}
  .chip-x:hover{color:var(--accent)}
  .chips-empty{color:var(--text-dim);font-size:.85rem;margin-bottom:10px}
  .addrow{display:flex;gap:8px}
  .addrow input{flex:1}
  .addbtn{flex:0 0 auto;width:46px;border:1px solid var(--border);border-radius:10px;cursor:pointer;
          background:var(--bg-soft);color:var(--text);font-size:1.3rem;font-weight:700;line-height:1}
  .addbtn:hover{border-color:var(--accent)}
  .quick{margin-top:18px}
  .quick-title{font-weight:600;margin-bottom:8px}
  .catalog{max-height:240px;overflow:auto;border:1px solid var(--border);border-radius:10px;
           padding:12px;background:rgba(0,0,0,.12)}
  .cat-group{margin-bottom:13px}
  .cat-group:last-child{margin-bottom:0}
  .cat-title{font-size:.74rem;text-transform:uppercase;letter-spacing:.04em;color:var(--text-dim);margin-bottom:7px}
  .pills{display:flex;flex-wrap:wrap;gap:7px}
  .pill{cursor:pointer;padding:5px 11px;border-radius:999px;border:1px solid var(--border);
        background:var(--bg-soft);color:var(--text);font-size:.86rem;transition:background .12s,border-color .12s,color .12s}
  .pill:hover{border-color:var(--accent-2)}
  .pill.on{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;color:#fff}
  .tabs{display:flex;gap:8px;margin-bottom:18px}
  .tab{flex:1;padding:9px 12px;border:1px solid var(--border);border-radius:10px;cursor:pointer;
       background:var(--bg-soft);color:var(--text-dim);font-weight:700;font-size:.95rem;
       transition:background .15s,color .15s,border-color .15s}
  .tab:hover{border-color:var(--accent-2)}
  .tab.active{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border-color:transparent}
  input[type=file]{width:100%;padding:9px 11px;border-radius:10px;border:1px dashed var(--border);
                   background:var(--bg-soft);color:var(--text-dim);font-size:.9rem}
  button.go{margin-top:22px;width:100%;padding:13px;border:none;border-radius:10px;cursor:pointer;
    font-size:1.05rem;font-weight:700;color:#fff;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    box-shadow:0 6px 20px rgba(215,10,83,.35);transition:transform .12s,opacity .2s}
  button.go:hover:not(:disabled){transform:translateY(-2px)}
  button.go:disabled{opacity:.55;cursor:not-allowed}
  .status{margin-top:18px;padding:14px 16px;border-radius:10px;display:none;font-size:.95rem}
  .status.show{display:block}
  .status.work{background:rgba(56,139,253,.12);border:1px solid var(--info);color:#cfe3ff}
  .status.ok{background:rgba(46,160,67,.12);border:1px solid var(--ok);color:#caf0d4}
  .status.err{background:rgba(215,10,83,.12);border:1px solid var(--accent);color:#ffd0df}
  .logtail{margin:10px 0 0;padding:10px;background:rgba(0,0,0,.25);border:1px solid var(--border);border-radius:8px;
           font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;line-height:1.4;white-space:pre-wrap;
           word-break:break-word;max-height:160px;overflow:auto;opacity:.9}
  .spin{display:inline-block;width:15px;height:15px;border:2px solid currentColor;border-right-color:transparent;
    border-radius:50%;animation:spin 1s linear infinite;vertical-align:-2px;margin-right:8px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .pbar{height:10px;background:var(--bg-soft);border:1px solid var(--border);border-radius:6px;overflow:hidden;margin-top:10px}
  .pbar-fill{height:100%;width:0;border-radius:6px;background:linear-gradient(135deg,var(--accent),var(--accent-2));transition:width .3s ease}
  .pbar.indet .pbar-fill{width:35%;animation:indet 1.2s ease-in-out infinite}
  @keyframes indet{0%{margin-left:-35%}100%{margin-left:100%}}
  .srv{color:var(--text-dim);font-size:.8rem;margin-top:14px;text-align:center}
  footer{color:var(--text-dim);font-size:.8rem;margin-top:14px;text-align:center}
  footer a{color:var(--text-dim);text-decoration:none}
  footer a:hover{color:var(--text)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><span class="dot"></span> deb-downloader</div>
    <div class="lang" role="group" aria-label="Language">
      <button data-lang="fr" type="button">FR</button>
      <button data-lang="en" type="button">EN</button>
    </div>
  </div>
  <p class="sub" id="sub"></p>

  <div class="card">
    <div class="tabs">
      <button type="button" class="tab active" id="tab-pkgs"></button>
      <button type="button" class="tab" id="tab-update"></button>
    </div>

    <div class="row">
      <div>
        <label class="lbl-first" id="lbl-distro" for="distro"></label>
        <select id="distro"></select>
      </div>
      <div>
        <label class="lbl-first" id="lbl-release" for="release"></label>
        <select id="release"></select>
      </div>
    </div>

    <div id="mode-pkgs">
      <label id="lbl-packages"></label>
      <div id="chips" class="chips"></div>
      <div class="addrow">
        <input type="text" id="pkgadd" />
        <button type="button" id="pkgaddbtn" class="addbtn">+</button>
      </div>
      <div class="hint" id="hint"></div>

      <div class="quick">
        <div class="quick-title" id="lbl-quick"></div>
        <div id="catalog" class="catalog"></div>
        <div class="hint" id="quicknote"></div>
      </div>
    </div>

    <div id="mode-update" style="display:none">
      <p class="hint" id="upd-intro" style="margin-top:14px"></p>
      <label id="lbl-updfile" for="updfile"></label>
      <input type="file" id="updfile" />
      <div class="hint" id="upd-hint"></div>
    </div>

    <label class="check" id="norec-row"><input type="checkbox" id="norec" /> <span id="lbl-norec"></span> (<code>--no-install-recommends</code>)</label>

    <button class="go" id="go"></button>
    <div id="status" class="status"></div>
  </div>

  <div id="serverinfo" class="srv"></div>
  <footer><a id="homelink" href="/"></a> · <span id="footer"></span></footer>
</div>

var lang = "en";
function t(k){ return (I18N[lang] && I18N[lang][k]) || I18N.en[k] || k; }

// Turn a structured API error ({code, message, ...}) into a localized string.
// Escape HTML so untrusted text (e.g. raw container log lines) is safe to inject.
function esc(s){ return String(s).replace(/[&<>]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]; }); }

function localizeError(d){
  if(!d) return t("errFetch");
  switch(d.code){
    case "package_not_found": return t("errNotFound").replace("{pkgs}", (d.packages||[]).join(", "));
    case "invalid_names":      return t("errInvalid").replace("{names}", (d.names||[]).join(", "));
    case "too_many":           return t("errTooMany").replace("{max}", d.max);
    case "no_space":           return t("errNoSpace");
    case "too_large":          return t("errTooLarge").replace("{size}", formatSize(d.size)).replace("{max}", formatSize(d.max));
    case "repo_unavailable":   return t("errRepo").replace("{pkgs}", (d.packages||[]).join(", ")).replace("{repo}", d.repo||"").replace("{distro}", d.distro||"").replace("{release}", d.release||"").replace("{arch}", d.arch||"");
    case "version_not_found":  return t("errVersion").replace("{version}", d.version||"").replace("{package}", d.package||"");
    case "bad_status_file":    return t("errBadStatus");
    case "status_too_large":   return t("errStatusTooLarge");
    case "timeout": {
      var m = t("errTimeout");
      if(d.log_tail) m += "<pre class='logtail'>" + esc(d.log_tail) + "</pre>";
      return m;
    }
    default:                   return esc(d.message || t("errFetch"));
  }
}

    {n:"ufw",         en:"Firewall front-end",        fr:"Pare-feu simplifié"},
    {n:"clamav",      en:"Antivirus",                 fr:"Antivirus"}
  ]},
  {key:"catGitlab", tp:true, items:[
    {n:"gitlab-ce", en:"GitLab CE (large, ~1 GB+)", fr:"GitLab CE (volumineux, ~1 Go+)"}
  ]}
];

function addPackage(raw){
  raw = (raw || "").trim();
  if(!raw) return;
  // Support several names at once (space/comma) and an optional =version each.
  raw.split(/[\s,]+/).filter(Boolean).forEach(function(tok){
    var name = tok, ver = "";
    var eq = tok.indexOf("=");
    if(eq > 0){ name = tok.slice(0, eq).trim(); ver = tok.slice(eq+1).trim(); }
    if(!name) return;
    if(!(name in selected) || ver) selected[name] = ver;
  });
  renderChips(); syncCatalog();
}

function removePackage(name){ delete selected[name]; renderChips(); syncCatalog(); }

function renderChips(){
  chipsEl.innerHTML = "";
  var names = Object.keys(selected);
  if(names.length === 0){
    var e = document.createElement("div");
    e.className = "chips-empty"; e.textContent = t("noneSel");
    chipsEl.appendChild(e); return;
  }
  names.forEach(function(name){
    var chip = document.createElement("span"); chip.className = "chip";
    var nm = document.createElement("span"); nm.className = "chip-name"; nm.textContent = name;
    var ver = document.createElement("input"); ver.type = "text"; ver.className = "chip-ver";
    ver.value = selected[name] || ""; ver.setAttribute("placeholder", t("verPh"));
    ver.addEventListener("input", function(){ selected[name] = ver.value.trim(); });
    var x = document.createElement("button"); x.type = "button"; x.className = "chip-x";
    x.textContent = "×"; x.title = t("remove");
    x.addEventListener("click", function(){ removePackage(name); });
    chip.appendChild(nm); chip.appendChild(ver); chip.appendChild(x);
    chipsEl.appendChild(chip);
  });
}

function renderCatalog(){
  catalogEl.innerHTML = "";
  CATALOG.forEach(function(group){
    var g = document.createElement("div"); g.className = "cat-group";
    var title = document.createElement("div"); title.className = "cat-title";
    title.textContent = t(group.key) + (group.tp ? " · " + t("tpTag") : "");
    g.appendChild(title);
    var pills = document.createElement("div"); pills.className = "pills";
    group.items.forEach(function(it){
      var p = document.createElement("button"); p.type = "button";
      p.className = "pill" + ((it.n in selected) ? " on" : "");
      p.textContent = it.n; p.title = (lang === "fr" ? it.fr : it.en) || "";
      p.setAttribute("data-name", it.n);
      p.addEventListener("click", function(){
        if(it.n in selected) removePackage(it.n); else addPackage(it.n);
      });
      pills.appendChild(p);
    });
    g.appendChild(pills); catalogEl.appendChild(g);
  });
}

// Reflect the current selection on the catalog pills (cheap, no full re-render).
function syncCatalog(){
  var pills = catalogEl.querySelectorAll(".pill");
  for(var i=0;i<pills.length;i++){
    var n = pills[i].getAttribute("data-name");
    pills[i].classList.toggle("on", n in selected);
  }
}

addInput.addEventListener("keydown", function(e){
  if(e.key === "Enter" || e.key === ","){ e.preventDefault(); addPackage(addInput.value); addInput.value = ""; }
});
document.getElementById("pkgaddbtn").addEventListener("click", function(){
  addPackage(addInput.value); addInput.value = ""; addInput.focus();
});
renderCatalog(); renderChips();

// --- Mode: package fetch vs full system update ---------------------------
var mode = "pkgs";
var updFile = document.getElementById("updfile");

function setMode(m){
  mode = m;
  document.getElementById("tab-pkgs").classList.toggle("active", m === "pkgs");
  document.getElementById("tab-update").classList.toggle("active", m === "update");
  document.getElementById("mode-pkgs").style.display = (m === "pkgs") ? "" : "none";
  document.getElementById("mode-update").style.display = (m === "update") ? "" : "none";
  document.getElementById("norec-row").style.display = (m === "pkgs") ? "" : "none";
  goBtn.textContent = (m === "update") ? t("goUpdate") : t("go");
}
document.getElementById("tab-pkgs").addEventListener("click", function(){ setMode("pkgs"); });
document.getElementById("tab-update").addEventListener("click", function(){ setMode("update"); });

function renderServerInfo(){
  if(!serverStatus || serverStatus.disk_free == null){ serverInfoEl.textContent = ""; return; }
  var txt = t("srvDisk").replace("{free}", formatSize(serverStatus.disk_free));
  if(serverStatus.max_job_bytes) txt += t("srvMax").replace("{max}", formatSize(serverStatus.max_job_bytes));
  serverInfoEl.textContent = txt;
}

function formatSize(bytes){
  if (bytes == null) return "";
  if (bytes < 1024) return bytes + " B";
  if (bytes < 1048576) return (bytes/1024).toFixed(0) + " KB";
  return (bytes/1048576).toFixed(1) + " MB";
}

function applyLang(){
  document.documentElement.lang = lang;
  document.getElementById("sub").innerHTML = t("sub");
  document.getElementById("lbl-distro").textContent = t("distro");
  document.getElementById("lbl-release").textContent = t("release");
  document.getElementById("lbl-packages").textContent = t("packages");
  document.getElementById("hint").textContent = t("hint");
  document.getElementById("lbl-quick").textContent = t("quick");
  document.getElementById("quicknote").textContent = t("quicknote");
  document.getElementById("lbl-norec").textContent = t("norec");
  document.getElementById("footer").innerHTML = t("footer");
  document.getElementById("homelink").textContent = t("home");
  document.getElementById("tab-pkgs").textContent = t("tabPkgs");
  document.getElementById("tab-update").textContent = t("tabUpdate");
  document.getElementById("upd-intro").textContent = t("updIntro");
  document.getElementById("lbl-updfile").textContent = t("updFile");
  document.getElementById("upd-hint").textContent = t("updHint");
  goBtn.textContent = (mode === "update") ? t("goUpdate") : t("go");
  addInput.setAttribute("placeholder", t("addPh"));
  renderChips(); renderCatalog();
  var btns = document.querySelectorAll(".lang button");
  for (var i=0;i<btns.length;i++){ btns[i].classList.toggle("active", btns[i].getAttribute("data-lang")===lang); }
  if (lastStatus){ statusEl.innerHTML = lastStatus.fn(); }   // re-render the status in the new language
  renderServerInfo();                                        // re-render the disk/quota line
}
function setLang(l){ lang = (l==="fr")?"fr":"en"; try{localStorage.setItem("ddl_lang",lang);}catch(e){} applyLang(); }

// Remember the current status as a render function so it can be re-localized
// when the user switches language (FR/EN) after it was shown.
var lastStatus = null;
function showStatus(kind, fn){ lastStatus = {kind:kind, fn:fn}; statusEl.className = "status show " + kind; statusEl.innerHTML = fn(); }

function fillReleases(){
  var d = distroSel.value; releaseSel.innerHTML = "";
  (MAP[d] || []).forEach(function(r){
    var o = document.createElement("option");
    o.value = r.release;
    o.textContent = r.release + (r.eol ? " (EOL)" : "");
    releaseSel.appendChild(o);
  });
}

fetch("api/distributions")
  .then(function(r){ return r.json(); })
  .then(function(data){
    (data.distributions || []).forEach(function(item){
      if(!MAP[item.distro]) MAP[item.distro] = [];
      MAP[item.distro].push({release: item.release, eol: item.eol});
    });
    Object.keys(MAP).forEach(function(d){
      var o = document.createElement("option");
      o.value = d; o.textContent = d.charAt(0).toUpperCase() + d.slice(1);
      distroSel.appendChild(o);
    });
    fillReleases();
  })
  .catch(function(){ showStatus("err", function(){ return t("apiErr"); }); });

// Server status (free disk + per-job quota) for the info line.
fetch("api/status")
  .then(function(r){ return r.json(); })
  .then(function(s){ serverStatus = s; renderServerInfo(); })
  .catch(function(){});

distroSel.addEventListener("change", fillReleases);

function showError(d, fallbackMsg){
  // d = structured API detail ({code,...}) or null; fallbackMsg = plain string.
  showStatus("err", function(){
    return t("failPrefix") + (d && d.code ? localizeError(d) : (fallbackMsg || t("errFetch")));
  });
}

function pollJob(jobId, pkgsStr, distroV, relV){
  fetch("api/jobs/" + jobId)
    .then(function(res){
      if(!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    })
    .then(function(j){
      if(j.status === "queued"){
        showStatus("work", function(){ return t("queued"); });
        setTimeout(function(){ pollJob(jobId, pkgsStr, distroV, relV); }, 2000);
      } else if(j.status === "running"){
        var prog = j.progress;
        showStatus("work", function(){
          if (prog && prog.total){
            var pct = Math.min(100, Math.round(prog.done * 100 / prog.total));
            return t("progDownloading").replace("{done}", prog.done).replace("{total}", prog.total)
                 + '<div class="pbar"><div class="pbar-fill" style="width:' + pct + '%"></div></div>';
          }
          return t("progResolving") + '<div class="pbar indet"><div class="pbar-fill"></div></div>';
        });
        setTimeout(function(){ pollJob(jobId, pkgsStr, distroV, relV); }, 1500);
      } else if(j.status === "done"){
        var name = j.filename || "packages.zip";
        var dlUrl = j.download_url || ("api/jobs/" + jobId + "/download");
        var count = j.package_count, sizeStr = formatSize(j.size);
        var a = document.createElement("a");
        a.href = dlUrl; a.download = name;
        document.body.appendChild(a); a.click(); a.remove();
        showStatus("ok", function(){
          var html = t("done").replace("{name}", name);
          if (count != null || sizeStr){
            html += '<div style="margin-top:6px;font-size:.88rem;opacity:.85">'
                  + t("doneMeta").replace("{count}", count == null ? "?" : count).replace("{size}", sizeStr)
                  + '</div>';
          }
          html += '<div style="margin-top:8px"><a href="' + dlUrl + '" download="' + name
                + '" style="color:var(--ok);text-decoration:underline">' + t("redownload") + '</a></div>';
          return html;
        });
        goBtn.disabled = false;
      } else { // error
        if (j.error && j.error.code === "up_to_date"){
          showStatus("ok", function(){ return t("upToDate"); });
        } else {
          showError(j.error, null);
        }
        goBtn.disabled = false;
      }
    })
    .catch(function(err){ showError(null, err.message); goBtn.disabled = false; });
}

// Shared submit pipeline: POST, surface API errors, then start polling.
function submitJob(reqPromise, pkgsStr){
  var distroV = distroSel.value, relV = releaseSel.value;
  goBtn.disabled = true;
  showStatus("work", function(){ return t("queued"); });
  reqPromise
  .then(function(res){
    return res.json().then(function(j){
      if(!res.ok){
        var d = j && j.detail;
        var e = new Error((d && d.code) ? localizeError(d) : (typeof d === "string" ? d : t("errFetch")));
        if (d && d.code) e.apiDetail = d;
        throw e;
      }
      return j;
    }, function(){ throw new Error("HTTP " + res.status); });
  })
  .then(function(j){ pollJob(j.job_id, pkgsStr, distroV, relV); })
  .catch(function(err){
    showError(err.apiDetail, err.message);
    goBtn.disabled = false;
  });
}

goBtn.addEventListener("click", function(){
  if(mode === "update"){
    var f = updFile.files && updFile.files[0];
    if(!f){ showStatus("err", function(){ return t("updNoFile"); }); return; }
    var fd = new FormData();
    fd.append("distro", distroSel.value);
    fd.append("release", releaseSel.value);
    fd.append("status", f);
    submitJob(fetch("api/jobs/update", {method: "POST", body: fd}), t("tabUpdate"));
    return;
  }

  // Flush anything still typed in the add box, then build from the selection.
  if(addInput.value.trim()){ addPackage(addInput.value); addInput.value = ""; }
  var packages = Object.keys(selected).map(function(n){
    var v = (selected[n] || "").trim();
    return v ? (n + "=" + v) : n;
  });
  if(packages.length === 0){ showStatus("err", function(){ return t("noPkg"); }); return; }

  var body = {
    distro: distroSel.value, release: releaseSel.value, arch: "amd64",
    packages: packages, no_recommends: norec.checked
  };
  submitJob(fetch("api/jobs", {
    method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)
  }), packages.join(", "));
});

// init language: saved choice > browser > English
(function(){
  var saved=null; try{ saved=localStorage.getItem("ddl_lang"); }catch(e){}
  var nav=(navigator.language||"en").toLowerCase();
  lang = saved || (nav.indexOf("fr")===0 ? "fr" : "en");
  var btns=document.querySelectorAll(".lang button");
  for(var i=0;i<btns.length;i++){ (function(b){ b.addEventListener("click", function(){ setLang(b.getAttribute("data-lang")); }); })(btns[i]); }
  applyLang();
})();
</script>
