<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>deb-downloader</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<style>
  :root{
    --bg:#0d1117; --bg-soft:#161b22; --bg-card:#1b222c; --border:#2a3340;
    --text:#e6edf3; --text-dim:#9aa7b4; --accent:#d70a53; --accent-2:#e95420;
    --ok:#2ea043; --warn:#d29922; --info:#388bfd; --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(1100px 500px at 70% -10%,#1a2330 0%,var(--bg) 55%);
    color:var(--text);min-height:100vh;line-height:1.6;padding:34px 18px}
  .wrap{max-width:640px;margin:0 auto}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.4rem}
  .brand .dot{width:13px;height:13px;border-radius:50%;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 0 12px var(--accent)}
  .lang{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
  .lang button{background:transparent;color:var(--text-dim);border:none;cursor:pointer;
    padding:6px 11px;font-size:.85rem;font-weight:700;transition:background .15s,color .15s}
  .lang button.active{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff}
  .sub{color:var(--text-dim);margin-bottom:26px}
  .card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:24px}
  label{display:block;font-weight:600;margin:16px 0 6px}
  label.lbl-first{margin-top:0}
  select,input[type=text]{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--border);
    background:var(--bg-soft);color:var(--text);font-size:1rem}
  .row{display:flex;gap:14px;flex-wrap:wrap}
  .row>div{flex:1;min-width:140px}
  .check{display:flex;align-items:center;gap:9px;margin-top:16px;color:var(--text-dim);font-weight:400}
  .check input{width:auto}
  .hint{color:var(--text-dim);font-size:.85rem;margin-top:5px}
  button.go{margin-top:22px;width:100%;padding:13px;border:none;border-radius:10px;cursor:pointer;
    font-size:1.05rem;font-weight:700;color:#fff;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    box-shadow:0 6px 20px rgba(215,10,83,.35);transition:transform .12s,opacity .2s}
  button.go:hover:not(:disabled){transform:translateY(-2px)}
  button.go:disabled{opacity:.55;cursor:not-allowed}
  .status{margin-top:18px;padding:14px 16px;border-radius:10px;display:none;font-size:.95rem}
  .status.show{display:block}
  .status.work{background:rgba(56,139,253,.12);border:1px solid var(--info);color:#cfe3ff}
  .status.ok{background:rgba(46,160,67,.12);border:1px solid var(--ok);color:#caf0d4}
  .status.err{background:rgba(215,10,83,.12);border:1px solid var(--accent);color:#ffd0df}
  .spin{display:inline-block;width:15px;height:15px;border:2px solid currentColor;border-right-color:transparent;
    border-radius:50%;animation:spin 1s linear infinite;vertical-align:-2px;margin-right:8px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .pbar{height:10px;background:var(--bg-soft);border:1px solid var(--border);border-radius:6px;overflow:hidden;margin-top:10px}
  .pbar-fill{height:100%;width:0;border-radius:6px;background:linear-gradient(135deg,var(--accent),var(--accent-2));transition:width .3s ease}
  .pbar.indet .pbar-fill{width:35%;animation:indet 1.2s ease-in-out infinite}
  @keyframes indet{0%{margin-left:-35%}100%{margin-left:100%}}
  footer{color:var(--text-dim);font-size:.8rem;margin-top:24px;text-align:center}
  footer a{color:var(--text-dim);text-decoration:none}
  footer a:hover{color:var(--text)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><span class="dot"></span> deb-downloader</div>
    <div class="lang" role="group" aria-label="Language">
      <button data-lang="fr" type="button">FR</button>
      <button data-lang="en" type="button">EN</button>
    </div>
  </div>
  <p class="sub" id="sub"></p>

  <div class="card">
    <div class="row">
      <div>
        <label class="lbl-first" id="lbl-distro" for="distro"></label>
        <select id="distro"></select>
      </div>
      <div>
        <label class="lbl-first" id="lbl-release" for="release"></label>
        <select id="release"></select>
      </div>
      <div>
        <label class="lbl-first" id="lbl-arch" for="arch"></label>
        <select id="arch"></select>
      </div>
    </div>

    <label id="lbl-packages" for="packages"></label>
    <input type="text" id="packages" />
    <div class="hint" id="hint"></div>

    <label class="check"><input type="checkbox" id="norec" /> <span id="lbl-norec"></span> (<code>--no-install-recommends</code>)</label>

    <button class="go" id="go"></button>
    <div id="status" class="status"></div>
  </div>

  <footer><a id="homelink" href="/"></a> · <span id="footer"></span></footer>
</div>

<script>
var I18N = {
  en: {
    sub: "Pick a distribution, type one or more packages, and download a <b>.zip</b> containing the packages plus all their dependencies (offline-ready).",
    distro: "Distribution", release: "Version", arch: "Architecture", packages: "Package(s)",
    placeholder: "e.g. nginx  (space or comma separated)",
    hint: "Lowercase names only — letters, digits and + . _ -.",
    norec: "Exclude recommended packages",
    go: "⬇️ Fetch & download .zip",
    home: "← Home",
    footer: "© 2026 Remilulz91 — deb-downloader. All rights reserved.",
    noPkg: "Please enter at least one package.",
    apiErr: "Could not reach the API.",
    queued: '<span class="spin"></span>Queued… waiting for a free worker.',
    working: '<span class="spin"></span>Fetching {pkgs} for {distro} {release}… This can take a while.',
    progResolving: '<span class="spin"></span>Resolving dependencies…',
    progDownloading: "Downloading… {done}/{total} packages",
    done: "✅ Done — your download (<b>{name}</b>) has started.",
    doneMeta: "{count} package(s) · {size}",
    redownload: "Download again",
    failPrefix: "❌ ",
    errNotFound: "Package(s) not found: {pkgs}. Check the exact name — it may not exist in this distribution's repositories.",
    errInvalid: "Invalid package name(s): {names}. Use lowercase letters, digits and + . _ -.",
    errTooMany: "Too many packages (max {max}).",
    errEmulation: 'Fetching {arch} needs Docker emulation on this host. On an amd64 machine, install it once: <code>docker run --privileged --rm tonistiigi/binfmt --install {arch}</code>',
    errNoSpace: "Not enough disk space on the server to build this archive. Try a smaller package set.",
    errFetch: "The fetch failed. Check the package name and try again."
  },
  fr: {
    sub: "Choisissez une distribution, tapez un ou plusieurs paquets, et téléchargez un <b>.zip</b> contenant les paquets et toutes leurs dépendances (prêt hors-ligne).",
    distro: "Distribution", release: "Version", arch: "Architecture", packages: "Paquet(s)",
    placeholder: "ex. nginx  (séparés par espace ou virgule)",
    hint: "Noms en minuscules uniquement — lettres, chiffres et + . _ -.",
    norec: "Exclure les paquets recommandés",
    go: "⬇️ Récupérer & télécharger le .zip",
    home: "← Accueil",
    footer: "© 2026 Remilulz91 — deb-downloader. Tous droits réservés.",
    noPkg: "Veuillez saisir au moins un paquet.",
    apiErr: "Impossible de joindre l'API.",
    queued: '<span class="spin"></span>En file d\'attente… en attente d\'un emplacement libre.',
    working: '<span class="spin"></span>Récupération de {pkgs} pour {distro} {release}… Cela peut prendre un moment.',
    progResolving: '<span class="spin"></span>Résolution des dépendances…',
    progDownloading: "Téléchargement… {done}/{total} paquets",
    done: "✅ Terminé — votre téléchargement (<b>{name}</b>) a démarré.",
    doneMeta: "{count} paquet(s) · {size}",
    redownload: "Télécharger à nouveau",
    failPrefix: "❌ ",
    errNotFound: "Paquet(s) introuvable(s) : {pkgs}. Vérifiez le nom exact — il n'existe peut-être pas dans les dépôts de cette distribution.",
    errInvalid: "Nom(s) de paquet invalide(s) : {names}. Utilisez minuscules, chiffres et + . _ -.",
    errTooMany: "Trop de paquets (max {max}).",
    errEmulation: 'Récupérer en {arch} nécessite l\'émulation Docker sur cet hôte. Sur une machine amd64, installez-la une fois : <code>docker run --privileged --rm tonistiigi/binfmt --install {arch}</code>',
    errNoSpace: "Espace disque insuffisant sur le serveur pour générer cette archive. Essayez un ensemble de paquets plus petit.",
    errFetch: "La récupération a échoué. Vérifiez le nom du paquet et réessayez."
  }
};

var lang = "en";
function t(k){ return (I18N[lang] && I18N[lang][k]) || I18N.en[k] || k; }

// Turn a structured API error ({code, message, ...}) into a localized string.
function localizeError(d){
  if(!d) return t("errFetch");
  switch(d.code){
    case "package_not_found": return t("errNotFound").replace("{pkgs}", (d.packages||[]).join(", "));
    case "invalid_names":      return t("errInvalid").replace("{names}", (d.names||[]).join(", "));
    case "too_many":           return t("errTooMany").replace("{max}", d.max);
    case "emulation_missing":  return t("errEmulation").replace(/\{arch\}/g, d.arch || "arm64");
    case "no_space":           return t("errNoSpace");
    default:                   return d.message || t("errFetch");
  }
}

var distroSel = document.getElementById("distro");
var releaseSel = document.getElementById("release");
var archSel = document.getElementById("arch");
var pkgInput = document.getElementById("packages");
var norec = document.getElementById("norec");
var goBtn = document.getElementById("go");
var statusEl = document.getElementById("status");
var MAP = {};

function formatSize(bytes){
  if (bytes == null) return "";
  if (bytes < 1024) return bytes + " B";
  if (bytes < 1048576) return (bytes/1024).toFixed(0) + " KB";
  return (bytes/1048576).toFixed(1) + " MB";
}

function applyLang(){
  document.documentElement.lang = lang;
  document.getElementById("sub").innerHTML = t("sub");
  document.getElementById("lbl-distro").textContent = t("distro");
  document.getElementById("lbl-release").textContent = t("release");
  document.getElementById("lbl-arch").textContent = t("arch");
  document.getElementById("lbl-packages").textContent = t("packages");
  document.getElementById("hint").textContent = t("hint");
  document.getElementById("lbl-norec").textContent = t("norec");
  document.getElementById("footer").innerHTML = t("footer");
  document.getElementById("homelink").textContent = t("home");
  goBtn.textContent = t("go");
  pkgInput.setAttribute("placeholder", t("placeholder"));
  var btns = document.querySelectorAll(".lang button");
  for (var i=0;i<btns.length;i++){ btns[i].classList.toggle("active", btns[i].getAttribute("data-lang")===lang); }
  if (lastStatus){ statusEl.innerHTML = lastStatus.fn(); }   // re-render the status in the new language
}
function setLang(l){ lang = (l==="fr")?"fr":"en"; try{localStorage.setItem("ddl_lang",lang);}catch(e){} applyLang(); }

// Remember the current status as a render function so it can be re-localized
// when the user switches language (FR/EN) after it was shown.
var lastStatus = null;
function showStatus(kind, fn){ lastStatus = {kind:kind, fn:fn}; statusEl.className = "status show " + kind; statusEl.innerHTML = fn(); }

function fillReleases(){
  var d = distroSel.value; releaseSel.innerHTML = "";
  (MAP[d] || []).forEach(function(r){
    var o = document.createElement("option"); o.value = r; o.textContent = r; releaseSel.appendChild(o);
  });
}

fetch("api/distributions")
  .then(function(r){ return r.json(); })
  .then(function(data){
    (data.distributions || []).forEach(function(item){
      if(!MAP[item.distro]) MAP[item.distro] = [];
      MAP[item.distro].push(item.release);
    });
    Object.keys(MAP).forEach(function(d){
      var o = document.createElement("option");
      o.value = d; o.textContent = d.charAt(0).toUpperCase() + d.slice(1);
      distroSel.appendChild(o);
    });
    (data.arches || ["amd64"]).forEach(function(arch){
      var o = document.createElement("option"); o.value = arch; o.textContent = arch;
      archSel.appendChild(o);
    });
    fillReleases();
  })
  .catch(function(){ showStatus("err", function(){ return t("apiErr"); }); });

distroSel.addEventListener("change", fillReleases);

function showError(d, fallbackMsg){
  // d = structured API detail ({code,...}) or null; fallbackMsg = plain string.
  showStatus("err", function(){
    return t("failPrefix") + (d && d.code ? localizeError(d) : (fallbackMsg || t("errFetch")));
  });
}

function pollJob(jobId, pkgsStr, distroV, relV){
  fetch("api/jobs/" + jobId)
    .then(function(res){
      if(!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    })
    .then(function(j){
      if(j.status === "queued"){
        showStatus("work", function(){ return t("queued"); });
        setTimeout(function(){ pollJob(jobId, pkgsStr, distroV, relV); }, 2000);
      } else if(j.status === "running"){
        var prog = j.progress;
        showStatus("work", function(){
          if (prog && prog.total){
            var pct = Math.min(100, Math.round(prog.done * 100 / prog.total));
            return t("progDownloading").replace("{done}", prog.done).replace("{total}", prog.total)
                 + '<div class="pbar"><div class="pbar-fill" style="width:' + pct + '%"></div></div>';
          }
          return t("progResolving") + '<div class="pbar indet"><div class="pbar-fill"></div></div>';
        });
        setTimeout(function(){ pollJob(jobId, pkgsStr, distroV, relV); }, 1500);
      } else if(j.status === "done"){
        var name = j.filename || "packages.zip";
        var dlUrl = j.download_url || ("api/jobs/" + jobId + "/download");
        var count = j.package_count, sizeStr = formatSize(j.size);
        var a = document.createElement("a");
        a.href = dlUrl; a.download = name;
        document.body.appendChild(a); a.click(); a.remove();
        showStatus("ok", function(){
          var html = t("done").replace("{name}", name);
          if (count != null || sizeStr){
            html += '<div style="margin-top:6px;font-size:.88rem;opacity:.85">'
                  + t("doneMeta").replace("{count}", count == null ? "?" : count).replace("{size}", sizeStr)
                  + '</div>';
          }
          html += '<div style="margin-top:8px"><a href="' + dlUrl + '" download="' + name
                + '" style="color:var(--ok);text-decoration:underline">' + t("redownload") + '</a></div>';
          return html;
        });
        goBtn.disabled = false;
      } else { // error
        showError(j.error, null);
        goBtn.disabled = false;
      }
    })
    .catch(function(err){ showError(null, err.message); goBtn.disabled = false; });
}

goBtn.addEventListener("click", function(){
  var packages = pkgInput.value.split(/[\s,]+/).filter(Boolean);
  if(packages.length === 0){ showStatus("err", function(){ return t("noPkg"); }); return; }

  var body = {
    distro: distroSel.value, release: releaseSel.value, arch: archSel.value || "amd64",
    packages: packages, no_recommends: norec.checked
  };
  var pkgsStr = packages.join(", "), distroV = distroSel.value, relV = releaseSel.value;

  goBtn.disabled = true;
  showStatus("work", function(){ return t("queued"); });

  fetch("api/jobs", {
    method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)
  })
  .then(function(res){
    return res.json().then(function(j){
      if(!res.ok){
        var d = j && j.detail;
        var e = new Error((d && d.code) ? localizeError(d) : (typeof d === "string" ? d : t("errFetch")));
        if (d && d.code) e.apiDetail = d;
        throw e;
      }
      return j;
    }, function(){ throw new Error("HTTP " + res.status); });
  })
  .then(function(j){
    pollJob(j.job_id, pkgsStr, distroV, relV);
  })
  .catch(function(err){
    showError(err.apiDetail, err.message);
    goBtn.disabled = false;
  });
});

// init language: saved choice > browser > English
(function(){
  var saved=null; try{ saved=localStorage.getItem("ddl_lang"); }catch(e){}
  var nav=(navigator.language||"en").toLowerCase();
  lang = saved || (nav.indexOf("fr")===0 ? "fr" : "en");
  var btns=document.querySelectorAll(".lang button");
  for(var i=0;i<btns.length;i++){ (function(b){ b.addEventListener("click", function(){ setLang(b.getAttribute("data-lang")); }); })(btns[i]); }
  applyLang();
})();
</script>
</body>
</html>
