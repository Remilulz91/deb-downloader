# Configuration for GitHub's automatically generated release notes.
# When you click "Generate release notes" (or via the API), GitHub sorts the
# merged PRs by their labels into the categories below.
# Docs: https://docs.github.com/repositories/releasing-projects-on-github/automatically-generated-release-notes
changelog:
  exclude:
    labels:
      - ignore-for-release
      - duplicate
      - invalid
  categories:
    - title: ✨ New
      labels:
        - feature
        - enhancement
    - title: 🐞 Bug fixes
      labels:
        - bug
        - fix
    - title: 📚 Documentation
      labels:
        - documentation
    - title: 🔧 Other changes
      labels:
        - "*"
