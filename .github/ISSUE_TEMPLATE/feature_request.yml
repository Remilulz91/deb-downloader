name: 💡 Feature request
description: Suggest a feature or an improvement
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your suggestion! The author remains the sole decision-maker
        on whether and how it is integrated and released.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this idea solve?
      placeholder: "Today, I can't …"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
