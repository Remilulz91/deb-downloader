name: 🐞 Bug report
description: Report a malfunction in deb-downloader
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for contributing! Please describe the problem as precisely as possible.
        Reminder: only the author (Remilulz91) publishes official releases.
  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: What happens? What did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Choose …
        3. Click …
        4. See the error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: deb-downloader version
      description: Shown in the site banner (e.g. v0.1.0)
      placeholder: "v0.1.0"
    validations:
      required: true
  - type: dropdown
    id: distro
    attributes:
      label: Affected distribution (if applicable)
      options:
        - Not applicable / website only
        - Debian 13
        - Ubuntu 26.04
        - Other (specify below)
    validations:
      required: false
  - type: input
    id: env
    attributes:
      label: Browser / OS
      placeholder: "Firefox 128 on Windows 11"
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Screenshots / logs / context
    validations:
      required: false
