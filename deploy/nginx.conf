# deb-downloader — nginx server block for the static site (local HTTP).
# This file is mounted into the nginx container at:
#   /etc/nginx/conf.d/default.conf
# It serves the static site over plain HTTP on port 80 (no domain / no TLS).

server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # --- Gzip compression -------------------------------------------------
    gzip            on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;

    # --- Basic security headers ------------------------------------------
    add_header X-Content-Type-Options "nosniff"                 always;
    add_header X-Frame-Options        "SAMEORIGIN"              always;
    add_header Referrer-Policy        "no-referrer-when-downgrade" always;

    # --- Do NOT expose source / VCS / project files over HTTP -------------
    # The web root is the whole repository, so we explicitly block anything
    # that is not part of the public site (.git, docs, backend, etc.).
    location ~ /\.            { deny all; }                 # .git and dotfiles
    location ^~ /backend/     { deny all; }
    location ^~ /deploy/      { deny all; }
    location ~* \.(md|py|yml|yaml)$ { return 403; }

    # --- Reverse proxy to the engine/API ---------------------------------
    # The website stays at "/"; the tool (API + its UI) is reachable at "/app"
    # — no port to type. The API runs on the host at port 8000; the container
    # reaches it via the host gateway of the fixed Compose subnet (172.20.0.1).
    location = /app { return 301 /app/; }
    location ^~ /app/ {
        # System-update jobs upload the machine's dpkg status file (3-5 MB
        # typically; nginx's default limit is 1 MB). Keep in sync with the
        # API's own limit (MAX_STATUS_BYTES, 20 MB).
        client_max_body_size 25m;
        proxy_pass http://172.20.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A fetch downloads packages and can take minutes — allow a long wait.
        proxy_connect_timeout 60s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;
        proxy_buffering       off;
    }

    # --- Static site ------------------------------------------------------
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
