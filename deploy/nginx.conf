# deb-downloader — nginx server block for the static site (local HTTP).
# This file is mounted into the nginx container at:
#   /etc/nginx/conf.d/default.conf
# It serves the static site over plain HTTP on port 80 (no domain / no TLS).

server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # --- Gzip compression -------------------------------------------------
    gzip            on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;

    # --- Basic security headers ------------------------------------------
    add_header X-Content-Type-Options "nosniff"                 always;
    add_header X-Frame-Options        "SAMEORIGIN"              always;
    add_header Referrer-Policy        "no-referrer-when-downgrade" always;

    # --- Do NOT expose source / VCS / project files over HTTP -------------
    # The web root is the whole repository, so we explicitly block anything
    # that is not part of the public site (.git, docs, backend, etc.).
    location ~ /\.            { deny all; }                 # .git and dotfiles
    location ^~ /backend/     { deny all; }
    location ^~ /deploy/      { deny all; }
    location ~* \.(md|py|yml|yaml)$ { return 403; }

    # --- Static site ------------------------------------------------------
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
