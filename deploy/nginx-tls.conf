# deb-downloader — nginx server block WITH HTTPS (optional).
# Mounted into the nginx container at /etc/nginx/conf.d/default.conf when HTTPS
# is enabled by the installer. Certificates are expected at /etc/nginx/certs/
# (fullchain.pem + privkey.pem), mounted from deploy/certs/.
#
# This is the TLS counterpart of nginx.conf: same site + /app reverse proxy,
# plus a plain-HTTP server that redirects everything to HTTPS, and HSTS.

# --- Rate limiting (anti-DoS) --------------------------------------------
limit_req_zone  $binary_remote_addr zone=ddl_req:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=ddl_conn:10m;

# Plain HTTP -> redirect everything to HTTPS.
server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root  /usr/share/nginx/html;
    index index.html;

    limit_conn ddl_conn 20;
    limit_req  zone=ddl_req burst=40 nodelay;
    limit_req_status 429;
    limit_conn_status 429;

    # --- Gzip compression -------------------------------------------------
    gzip            on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;

    # --- Security headers (incl. HSTS, valid because we are on HTTPS) ------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff"             always;
    add_header X-Frame-Options        "DENY"                always;
    add_header Referrer-Policy        "no-referrer"         always;
    add_header Permissions-Policy     "geolocation=(), microphone=(), camera=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://api.github.com; base-uri 'none'; frame-ancestors 'none'; object-src 'none'" always;

    # --- Do NOT expose source / VCS / project files over HTTP -------------
    location ~ /\.            { deny all; }
    location ^~ /backend/     { deny all; }
    location ^~ /deploy/      { deny all; }
    location ~* \.(md|py|yml|yaml)$ { return 403; }

    # --- Reverse proxy to the engine/API ---------------------------------
    location = /app { return 301 /app/; }
    location ^~ /app/ {
        client_max_body_size 25m;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_pass http://172.20.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;
        proxy_buffering       off;
    }

    # --- Static site ------------------------------------------------------
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
