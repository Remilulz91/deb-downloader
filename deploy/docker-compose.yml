# deb-downloader — serve the static site with nginx in Docker (local HTTP).
# Usage (from /var/www/deb-downloader):
#   docker compose -f deploy/docker-compose.yml up -d
#
# The whole project folder is mounted read-only as the web root; the nginx
# config above (deploy/nginx.conf) hides everything that is not the site.

services:
  web:
    image: nginx:stable-alpine
    container_name: deb-downloader-web
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - /var/www/deb-downloader:/usr/share/nginx/html:ro
      - /var/www/deb-downloader/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # --- Optional: expose nginx logs to the host for fail2ban ----------
      # Uncomment the next line (and create the folder) to enable the
      # optional nginx fail2ban jail described in DEPLOY.md.
      # - /var/log/deb-downloader-nginx:/var/log/nginx

# Fixed subnet so the host gateway is always 172.20.0.1 — used by the nginx
# reverse proxy (deploy/nginx.conf, location /app/) to reach the engine/API
# running on the host at port 8000.
networks:
  default:
    ipam:
      config:
        - subnet: 172.20.0.0/24
