<style>
  :root {
    --bg:#0d1117; --bg-soft:#161b22; --bg-card:#1b222c; --border:#2a3340;
    --text:#e6edf3; --text-dim:#9aa7b4; --accent:#d70a53; --accent-2:#e95420;
    --ok:#2ea043; --warn:#d29922; --info:#388bfd;
    --radius:14px; --shadow:0 8px 30px rgba(0,0,0,.35); --maxw:980px;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html { scroll-behavior:smooth; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(1200px 600px at 70% -10%, #1a2330 0%, var(--bg) 55%);
    color:var(--text); line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  a { color:inherit; }
  .wrap { max-width:var(--maxw); margin:0 auto; padding:0 22px; }
  header { position:sticky; top:0; z-index:50; backdrop-filter:blur(10px);
    background:rgba(13,17,23,.72); border-bottom:1px solid var(--border); }
  .nav { display:flex; align-items:center; justify-content:space-between; height:62px; gap:14px; }
  .brand { display:flex; align-items:center; gap:10px; font-weight:700; font-size:1.15rem; letter-spacing:.2px; }
  .brand .dot { width:12px; height:12px; border-radius:50%;
    background:linear-gradient(135deg,var(--accent),var(--accent-2)); box-shadow:0 0 12px var(--accent); }
  .nav-right { display:flex; align-items:center; gap:22px; }
  .nav-links { display:flex; gap:22px; font-size:.95rem; }
  .nav-links a { color:var(--text-dim); text-decoration:none; transition:color .15s; }
  .nav-links a:hover { color:var(--text); }
  .lang { display:flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  .lang button { background:transparent; color:var(--text-dim); border:none; cursor:pointer;
    padding:6px 11px; font-size:.85rem; font-weight:700; transition:background .15s,color .15s; }
  .lang button.active { background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:#fff; }
  @media (max-width:680px){ .nav-links { display:none; } }
  .hero { padding:78px 0 40px; text-align:center; }
  .hero h1 { font-size:clamp(2.1rem,5vw,3.3rem); line-height:1.1; font-weight:800; }
  .hero h1 .grad { background:linear-gradient(135deg,var(--accent),var(--accent-2));
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  .hero p.lead { max-width:680px; margin:18px auto 0; font-size:1.18rem; color:var(--text-dim); }
  .cta-row { display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin-top:30px; }
  .btn { display:inline-flex; align-items:center; gap:9px; padding:12px 22px; border-radius:10px;
    font-weight:600; font-size:1rem; text-decoration:none; border:1px solid transparent; cursor:pointer;
    transition:transform .12s,background .15s,border .15s; }
  .btn:hover { transform:translateY(-2px); }
  .btn-primary { background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:#fff;
    box-shadow:0 6px 20px rgba(215,10,83,.35); }
  .btn-ghost { background:var(--bg-card); color:var(--text); border-color:var(--border); }
  .version-banner { margin:26px auto 0; max-width:720px; border:1px solid var(--border);
    border-radius:var(--radius); background:var(--bg-card); box-shadow:var(--shadow);
    padding:20px 24px; text-align:left; display:flex; align-items:center; gap:18px; transition:border-color .25s; }
  .vb-icon { flex:none; width:44px; height:44px; border-radius:50%; display:grid; place-items:center;
    font-size:1.4rem; background:var(--bg-soft); }
  .vb-body { flex:1; min-width:0; }
  .vb-title { font-weight:700; font-size:1.05rem; }
  .vb-sub { color:var(--text-dim); font-size:.92rem; margin-top:2px; }
  .vb-sub code { background:var(--bg-soft); padding:1px 7px; border-radius:6px; font-size:.85rem; }
  .vb-action { flex:none; }
  .version-banner.is-ok { border-color:var(--ok); } .version-banner.is-ok .vb-icon { color:var(--ok); }
  .version-banner.is-warn { border-color:var(--warn); } .version-banner.is-warn .vb-icon { color:var(--warn); }
  .version-banner.is-info { border-color:var(--info); } .version-banner.is-info .vb-icon { color:var(--info); }
  .version-banner.is-loading .vb-icon { color:var(--text-dim); }
  .spin { animation:spin 1s linear infinite; display:inline-block; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @media (max-width:560px){ .version-banner { flex-direction:column; align-items:flex-start; }
    .vb-action { width:100%; } .vb-action .btn { width:100%; justify-content:center; } }
  section.block { padding:56px 0; border-top:1px solid var(--border); }
  section.block h2 { font-size:1.7rem; font-weight:800; margin-bottom:8px; }
  section.block .sub { color:var(--text-dim); margin-bottom:30px; max-width:640px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:18px; }
  .card { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:22px; }
  .card .ico { font-size:1.6rem; margin-bottom:10px; }
  .card h3 { font-size:1.1rem; margin-bottom:6px; }
  .card p { color:var(--text-dim); font-size:.95rem; }
  ol.steps { list-style:none; counter-reset:s; display:grid; gap:14px; }
  ol.steps li { counter-increment:s; position:relative; padding:16px 18px 16px 60px;
    background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); }
  ol.steps li::before { content:counter(s); position:absolute; left:16px; top:50%; transform:translateY(-50%);
    width:30px; height:30px; border-radius:50%; background:linear-gradient(135deg,var(--accent),var(--accent-2));
    color:#fff; font-weight:700; display:grid; place-items:center; }
  ol.steps li b { display:block; }
  ol.steps li span { color:var(--text-dim); font-size:.93rem; }
  .note { background:var(--bg-soft); border:1px solid var(--border); border-left:4px solid var(--info);
    border-radius:10px; padding:16px 18px; color:var(--text-dim); font-size:.95rem; }
  .note b { color:var(--text); }
  footer { border-top:1px solid var(--border); padding:34px 0 60px; color:var(--text-dim); font-size:.9rem; }
  footer .frow { display:flex; justify-content:space-between; gap:18px; flex-wrap:wrap; align-items:center; }
  footer a { color:var(--text-dim); } footer a:hover { color:var(--text); }
  .copyright { font-size:.85rem; } .copyright b { color:var(--text); }
</style>

var currentLang = "fr";
var lastResult  = null;

function t(key){ return (I18N[currentLang] && I18N[currentLang][key]) || I18N.fr[key] || key; }

function applyI18n(){
  document.documentElement.lang = currentLang;
  document.getElementById("meta-desc").setAttribute("content", t("meta.desc"));
  var nodes = document.querySelectorAll("[data-i18n]");
  for (var i=0;i<nodes.length;i++){ nodes[i].innerHTML = t(nodes[i].getAttribute("data-i18n")); }
  var y = document.getElementById("year"); if (y) y.textContent = new Date().getFullYear();
  var btns = document.querySelectorAll(".lang button");
  for (var j=0;j<btns.length;j++){ btns[j].classList.toggle("active", btns[j].getAttribute("data-lang") === currentLang); }
  renderBanner();
}

function setLang(lang){
  currentLang = (lang === "en") ? "en" : "fr";
  try { localStorage.setItem("ddl_lang", currentLang); } catch(e){}
  applyI18n();
}

(function(){
  var links = [["nav-gh", GH_REPO_URL],["footer-gh", GH_REPO_URL],["cta-download", GH_REPO_URL + "/releases/latest"]];
  for (var i=0;i<links.length;i++){ var el = document.getElementById(links[i][0]); if (el) el.href = links[i][1]; }
  // "Open the tool" points to the reverse-proxied API (/app). Only show it when
  // a backend likely exists — i.e. not on GitHub Pages (github.io).
  var tool = document.getElementById("cta-tool");
  if (tool && !/\.github\.io$/i.test(location.hostname)) { tool.style.display = ""; }
})();

function compareVersions(a, b){
  var clean = function(v){ return String(v).trim().replace(/^v/i,"").split("-")[0]; };
  var pa = clean(a).split(".").map(function(n){ return parseInt(n,10)||0; });
  var pb = clean(b).split(".").map(function(n){ return parseInt(n,10)||0; });
  var len = Math.max(pa.length, pb.length);
  for (var i=0;i<len;i++){ var x=pa[i]||0, y=pb[i]||0; if(x>y)return 1; if(x<y)return -1; }
  return 0;
}

function renderBanner(){
  var box=document.getElementById("version-banner");
  var icon=document.querySelector("#version-banner .vb-icon");
  var title=document.getElementById("vb-title");
  var sub=document.getElementById("vb-sub");
  var action=document.getElementById("vb-action");
  if (!lastResult){
    box.className="version-banner is-loading";
    icon.innerHTML='<span class="spin">⏳</span>';
    title.textContent=t("vb.checking");
    sub.innerHTML=t("vb.thiscopy")+" <code>"+CONFIG.version+"</code>";
    action.innerHTML=""; return;
  }
  var r=lastResult;
  if (r.state==="ok"){
    box.className="version-banner is-ok"; icon.textContent="✅";
    title.textContent=t("vb.ok.t");
    sub.innerHTML=t("vb.thiscopy")+" <code>"+CONFIG.version+"</code> · "+t("vb.latest")+" <code>"+r.latest+"</code>";
    action.innerHTML='<a class="btn btn-ghost" href="'+GH_REPO_URL+'/releases" target="_blank" rel="noopener">'+t("vb.notes")+'</a>';
  } else if (r.state==="warn"){
    box.className="version-banner is-warn"; icon.textContent="⚠️";
    title.textContent=t("vb.warn.t");
    sub.innerHTML=t("vb.thiscopy")+" <code>"+CONFIG.version+"</code> · "+t("vb.latest")+" <code>"+r.latest+"</code>";
    action.innerHTML='<a class="btn btn-primary" href="'+r.url+'" target="_blank" rel="noopener">'+t("vb.warn.btn").replace("{latest}", r.latest)+'</a>';
  } else if (r.state==="none"){
    box.className="version-banner is-info"; icon.textContent="ℹ️";
    title.textContent=t("vb.none.t");
    sub.innerHTML=t("vb.thiscopy")+" <code>"+CONFIG.version+"</code>";
    action.innerHTML='<a class="btn btn-ghost" href="'+GH_REPO_URL+'" target="_blank" rel="noopener">'+t("vb.seerepo")+'</a>';
  } else {
    box.className="version-banner is-info"; icon.textContent="❓";
    title.textContent=t("vb.err.t");
    sub.innerHTML=t("vb.err.sub").replace("{v}", CONFIG.version).replace("{rel}", GH_REPO_URL+"/releases");
    action.innerHTML="";
  }
}

function checkVersion(){
  fetch(GH_API_LATEST, { headers:{ "Accept":"application/vnd.github+json" } })
    .then(function(res){
      if (res.status===404){ lastResult={state:"none"}; renderBanner(); return null; }
      if (!res.ok) throw new Error("HTTP "+res.status);
      return res.json();
    })
    .then(function(data){
      if (!data) return;
      var latest = data.tag_name || data.name;
      if (!latest) throw new Error("no tag");
      var cmp = compareVersions(CONFIG.version, latest);
      var url = data.html_url || (GH_REPO_URL + "/releases/latest");
      lastResult = (cmp >= 0) ? {state:"ok", latest:latest} : {state:"warn", latest:latest, url:url};
      renderBanner();
    })
    .catch(function(){ lastResult={state:"error"}; renderBanner(); });
}

(function init(){
  var saved=null; try { saved=localStorage.getItem("ddl_lang"); } catch(e){}
  var nav=(navigator.language || "fr").toLowerCase();
  currentLang = saved || (nav.indexOf("en")===0 ? "en" : "fr");
  var btns=document.querySelectorAll(".lang button");
  for (var i=0;i<btns.length;i++){
    (function(b){ b.addEventListener("click", function(){ setLang(b.getAttribute("data-lang")); }); })(btns[i]);
  }
  applyI18n();
  checkVersion();
})();
</script>
</body>
